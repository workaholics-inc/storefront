name: gate

on:
  push:
    branches:
      - main
      - "m*/**"
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
      - run: pnpm build
        env:
          # Public placeholders: the build never contacts a platform.
          PLATFORM_URL: http://127.0.0.1:4010
          STOREFRONT_API_KEY: mock-storefront-key-not-a-secret-000000

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source . --redact --no-banner
